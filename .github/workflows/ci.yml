name: CI

on: push

jobs:
  build:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DNATIVE=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
      
      
      # Every perft count up to 200 million nodes per position, about half a minute.
      # Debug builds skip it: under the sanitizers it would take several minutes.
      - name: Deep perft
        if: matrix.build_type == 'Release'
        run: ./build/test_perft tests/perft_positions.epd --deep

      # The bench node count is the search's fingerprint; the log keeps it for every push.
      - name: Bench
        if: matrix.build_type == 'Release'
        run: ./build/engine bench

      # A short UCI session: the end of the input stops the search, and depth 1 always
      # completes, so a bestmove must come back.
      - name: Smoke test
        run: |
          printf 'uci\nisready\nposition startpos moves e2e4\ngo depth 4\n' | ./build/engine > uci.out
          cat uci.out
          grep '^bestmove ' uci.out
